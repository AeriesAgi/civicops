version: '3.9'

# ── CivicOps Command — Full Stack Local Deployment ──────────────────
# Run:  docker compose up -d
# Logs: docker compose logs -f api
# Stop: docker compose down

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicops-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=civicops;Username=civicops;Password=${DB_PASSWORD:-civicops_dev_pw}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-redis_dev_pw},abortConnect=false"
      Jwt__Secret: ${JWT_SECRET:-dev_secret_key_must_be_at_least_32_characters_long_xxxx}
      Jwt__Issuer: "https://civicops.io"
      Jwt__Audience: "civicops-client"
      AI__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Twilio__AccountSid: ${TWILIO_SID:-}
      Twilio__AuthToken: ${TWILIO_TOKEN:-}
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - civicops-net
    volumes:
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: civicops-postgres
    environment:
      POSTGRES_DB: civicops
      POSTGRES_USER: civicops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-civicops_dev_pw}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    networks:
      - civicops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicops -d civicops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicops-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_pw}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - civicops-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_pw}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: civicops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-civicops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_dev_pw}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - civicops-net

  nginx:
    image: nginx:alpine
    container_name: civicops-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - civicops-net

  # Observability stack (optional — enable with --profile observability)
  prometheus:
    image: prom/prometheus:latest
    container_name: civicops-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - civicops-net

  grafana:
    image: grafana/grafana:latest
    container_name: civicops-grafana
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - civicops-net

networks:
  civicops-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  grafana-data:
  api-logs:
